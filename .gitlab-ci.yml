# Sync GitLab → GitHub
# Set GITHUB_REPO_URL in CI/CD variables

stages:
  - sync

sync-to-github:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - |
      # Debug: Check if variables are available
      echo "Checking environment variables..."
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_TOKEN is empty or not set"
        echo "Available CI variables:"
        env | grep -i "CI_" | head -10 || echo "No CI variables found"
        echo ""
        echo "If GITHUB_TOKEN is marked as 'Protected' in GitLab, make sure:"
        echo "1. The branch '${CI_COMMIT_REF_NAME}' is a protected branch, OR"
        echo "2. Uncheck 'Protected' for the GITHUB_TOKEN variable in Settings → CI/CD → Variables"
        exit 1
      else
        echo "GITHUB_TOKEN is set (length: ${#GITHUB_TOKEN} characters)"
      fi
      
      # Skip if already synced
      if git log -1 --pretty=%B | grep -q "\[skip sync\]"; then
        echo "Skipping sync - commit marked with [skip sync]"
        exit 0
      fi
      
      GITHUB_REPO_URL="${GITHUB_REPO_URL:-https://github.com/$CI_PROJECT_PATH.git}"
      
      if ! git remote | grep -q github; then
        git remote add github "${GITHUB_REPO_URL}"
      else
        git remote set-url github "${GITHUB_REPO_URL}"
      fi
      
      CURRENT_BRANCH="${CI_COMMIT_REF_NAME#refs/heads/}"
      if [ -z "$CURRENT_BRANCH" ]; then
        CURRENT_BRANCH="${CI_COMMIT_BRANCH}"
      fi
      if [ -z "$CURRENT_BRANCH" ]; then
        echo "Error: Could not determine current branch"
        git branch -a
        exit 1
      fi
      echo "Current branch: ${CURRENT_BRANCH}"
      
      git checkout -f ${CURRENT_BRANCH} || {
        echo "Error: Could not checkout branch ${CURRENT_BRANCH}"
        exit 1
      }
      
      # Check if token looks valid (GitHub tokens usually start with ghp_ for classic tokens)
      if ! echo "$GITHUB_TOKEN" | grep -qE "^ghp_|^github_pat_"; then
        echo "⚠️  Warning: GITHUB_TOKEN doesn't look like a valid GitHub token"
        echo "GitHub tokens usually start with 'ghp_' (classic) or 'github_pat_' (fine-grained)"
        echo "Make sure you set the actual token value, not a descriptive name"
        echo "Token length: ${#GITHUB_TOKEN} characters"
      else
        echo "✓ GITHUB_TOKEN format looks valid"
      fi
      
      GITHUB_URL_WITH_TOKEN=$(echo "$GITHUB_REPO_URL" | sed "s|https://|https://${GITHUB_TOKEN}@|")
      git remote set-url github "${GITHUB_URL_WITH_TOKEN}"
      
      git fetch github 2>&1 || echo "Note: Could not fetch from GitHub (repo may be empty)"
      
      echo "Pushing ${CURRENT_BRANCH} to GitHub..."
      if git push github ${CURRENT_BRANCH}:${CURRENT_BRANCH}; then
        echo "✅ Successfully synced ${CURRENT_BRANCH} to GitHub"
      else
        # Try handling conflicts
        if git push github ${CURRENT_BRANCH}:${CURRENT_BRANCH} 2>&1 | grep -q "non-fast-forward\|rejected"; then
          echo "Branches diverged, merging..."
          git fetch github ${CURRENT_BRANCH}
          git merge github/${CURRENT_BRANCH} -X ours -m "Merge from GitHub - kept GitLab version [skip sync]" || {
            echo "Merge failed"
            exit 1
          }
          if git push github ${CURRENT_BRANCH}:${CURRENT_BRANCH}; then
            echo "✅ Synced after merge"
          else
            echo "Push failed after merge"
            exit 1
          fi
        else
          echo "Push failed - check token permissions"
          exit 1
        fi
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success

sync-from-github:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - |
      GITHUB_REPO_URL="${GITHUB_REPO_URL:-https://github.com/$CI_PROJECT_PATH.git}"
      
      if ! git remote | grep -q github; then
        git remote add github "${GITHUB_REPO_URL}"
      else
        git remote set-url github "${GITHUB_REPO_URL}"
      fi
      
      if [ -n "$GITHUB_TOKEN" ]; then
        GITHUB_URL_WITH_TOKEN=$(echo "$GITHUB_REPO_URL" | sed "s|https://|https://${GITHUB_TOKEN}@|")
        git remote set-url github "${GITHUB_URL_WITH_TOKEN}"
      fi
      
      git fetch github
      
      CURRENT_BRANCH=$(echo $CI_COMMIT_REF_NAME)
      git checkout ${CURRENT_BRANCH}
      
      if git merge github/${CURRENT_BRANCH} -X ours --no-edit; then
        echo "Merged GitHub changes"
      else
        if git status --porcelain | grep -q "^UU\|^AA"; then
          echo "Resolving conflicts..."
          git checkout --ours .
          git add -A
          git commit -m "Merge from GitHub - kept GitLab version [skip sync]" || echo "No changes"
        fi
      fi
      
      git push origin ${CURRENT_BRANCH} || echo "Push failed"
      echo "Done"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
