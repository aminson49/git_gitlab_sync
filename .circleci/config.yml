version: 2.1
jobs:
  sync:
    docker:
      - image: python:3.9
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            apt-get update && apt-get install -y curl || true
            pip install -r requirements.txt
      - run:
          name: Sync to GitLab
          command: |
            if [ -z "$GITHUB_TOKEN" ] || [ -z "$GITLAB_TOKEN" ] || [ -z "$GITHUB_REPO" ] || [ -z "$GITLAB_REPO" ]; then
              echo "Error: Missing required environment variables"
              exit 1
            fi
            
            export GITHUB_TOKEN=$GITHUB_TOKEN
            export GITLAB_TOKEN=$GITLAB_TOKEN
            export GITHUB_REPO=$GITHUB_REPO
            export GITLAB_REPO=$GITLAB_REPO
            
            if [ -n "$GITLAB_API_BASE" ]; then
              export GITLAB_API_BASE=$GITLAB_API_BASE
            fi
            
            python sync_repos.py code github-to-gitlab
workflows:
  version: 2
  sync-on-push:
    jobs:
      - sync:
          filters:
            branches:
              only: main
